name: Research integration checks

on:
  pull_request:
    paths:
      - "app/(root)/research/**"
      - "app/api/research/**"
      - "app/(auth)/sign-in/page.tsx"
      - "app/(auth)/sign-up/page.tsx"
      - "components/research/**"
      - "lib/quantagent/**"
      - "__tests__/quantagent-*.test.ts"
      - ".github/workflows/research-readonly.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx eslint "app/(root)/research" app/api/research "app/(auth)/sign-in/page.tsx" "app/(auth)/sign-up/page.tsx" components/research lib/quantagent __tests__/quantagent-*.test.ts
